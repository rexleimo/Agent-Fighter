# Minimum deployment unit: the app alone, against YOUR Postgres.
#   DATABASE_URL=postgres://... BETTER_AUTH_SECRET=$(openssl rand -hex 32) \
#     docker compose up -d --build
# Want a bundled Postgres too? Layer the override:
#   BETTER_AUTH_SECRET=$(openssl rand -hex 32) \
#     docker compose -f docker-compose.yml -f docker-compose.bundled-db.yml up -d --build
# Put the app behind a TLS reverse proxy for public exposure and set
# AFL_TRUST_PROXY=1 so rate limiting sees the real client IP.
# The administrator is created once through the /setup page on first visit.
# See docs/deployment.md.
services:
  app:
    build: .
    environment:
      # Required, but enforced at container start (not interpolation): the
      # bundled-db override supplies a default here, and compose interpolates
      # each file BEFORE merging, so a :? guard would break the override path.
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (e.g. openssl rand -hex 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:8787}
      PORT: "8787"
      # Hardening knobs — defaults are test-friendly; tighten for public exposure.
      AFL_MAX_BODY_BYTES: ${AFL_MAX_BODY_BYTES:-1048576}
      AFL_RATE_AUTH: ${AFL_RATE_AUTH:-300}
      AFL_RATE_GLOBAL: ${AFL_RATE_GLOBAL:-3000}
      AFL_TRUST_PROXY: ${AFL_TRUST_PROXY:-0}
    command: >-
      sh -c 'test -n "$$DATABASE_URL" || { echo "DATABASE_URL is required: set it (your Postgres URL), or layer docker-compose.bundled-db.yml" >&2; exit 1; }; bun run db:migrate && bun src/server.js'
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - afl-data:/app/data
    restart: unless-stopped

volumes:
  afl-data:
