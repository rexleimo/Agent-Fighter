name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Bun is the service runtime used by `pnpm verify`; pin to the Dockerfile version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm install --frozen-lockfile

      - name: Lint (existing script)
        run: pnpm lint:web

      - name: Static check (TypeScript, no emit)
        run: pnpm exec tsc -p frontend/tsconfig.json --noEmit

      - name: Full unit tests
        run: pnpm test:web

      # Full acceptance suite from the repo's own entry point. Database-dependent
      # gates skip when AFL_TEST_DATABASE_URL is unset, matching local behavior.
      - name: Full end-to-end verification
        run: pnpm verify
